<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Cat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo"><span class="logo-mark">🐾</span> Cyber Cat</span>
      </div>
      <div class="topbar-right">
        <button id="btn-home" class="btn ghost" title="回到书签页">书签</button>
        <button id="theme-toggle" class="btn ghost" title="切换明/暗主题">🌙 暗色</button>
        <div class="zoom-control" title="缩放">
          <button id="zoom-out" class="btn ghost" aria-label="缩小">−</button>
          <span id="zoom-label" class="zoom-label">100%</span>
          <button id="zoom-in" class="btn ghost" aria-label="放大">+</button>
          <button id="zoom-reset" class="btn ghost" title="重置" aria-label="重置缩放">⌂</button>
        </div>
      </div>
    </header>

    <!-- 内容区：书签页 或 文件浏览器 -->
    <main id="view-books" class="view"></main>
    <main id="view-browser" class="view hidden"></main>
  </div>

  <!-- 模态框 -->
  <div id="modal" class="modal hidden"></div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- 隐藏的 file input -->
  <input type="file" id="file-input" class="hidden" multiple>

  <script src="/static/app.js"></script>
</body>
</html>
